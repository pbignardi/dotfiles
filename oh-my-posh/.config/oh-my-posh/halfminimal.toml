console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true

[transient_prompt]
    template = '<b>$</> '
    foreground = "darkGray"
    background = "transparent"

[upgrade]
    source = 'cdn'
    interval = '168h'
    auto = false
    notice = false

[[blocks]]
    type = 'prompt'
    alignment = 'left'

    [[blocks.segments]]
        template = '({{.Venv}}) '
        foreground = 'yellow'
        background = 'transparent'
        type = 'python'
        style = 'diamond'

[[blocks]]
    type = 'prompt'
    alignment = 'left'
    newline = true

    [[blocks.segments]]
        template = '{{ .UserName }}'
        foreground = 'magenta'
        background = 'transparent'
        type = 'session'
        style = 'plain'

    [[blocks.segments]]
        template = " in "
        type = "text"
        style = "plain"
        foreground = "darkGray"

    [[blocks.segments]]
        style = 'plain'
        type = 'path'
        foreground = 'blue'
        template = "{{.Path}}"

        [blocks.segments.properties]
        style = 'agnoster'

    [[blocks.segments]]
        style = 'plain'
        type = 'text'
        foreground = 'lightRed'

    [[blocks.segments]]
        style = 'plain'
        type = 'git'
        foreground = 'lightRed'

    [[blocks.segments]]
        style = 'plain'
        type = 'text'
        foreground = 'white'
        template = '$ '
